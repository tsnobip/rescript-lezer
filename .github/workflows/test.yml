name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5.1'
          opam-pin: false
          opam-local-packages: vendored/rescript/rescript.opam

      - name: Install compiler dependencies
        working-directory: vendored/rescript
        run: opam install ./rescript.opam --deps-only -y

      - name: Build pinned ReScript compiler
        working-directory: vendored/rescript
        run: opam exec -- dune build compiler/bsc/rescript_compiler_main.exe

      - name: Test upstream corpus, fuzzing and incremental parsing
        run: npm run test:corpus -- --report "$RUNNER_TEMP/grammar-audit.json"

      - name: Upload grammar audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-audit
          path: ${{ runner.temp }}/grammar-audit.json
          if-no-files-found: ignore
